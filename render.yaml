services:
  - name: asmaraweb          # must match your Render service name exactly
    type: web
    runtime: static
    staticPublishPath: .
    buildCommand: ""

    routes:
      - source: /projects
        destination: /#work
        type: redirect
      - source: /reviews
        destination: /#reviews
        type: redirect
      - source: /contact
        destination: /#contact
        type: redirect

    headers:
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.avif
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.png
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /styles.css
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /app.js
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=86400
